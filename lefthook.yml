pre-commit:
  parallel: true
  commands:
    lint:
      files: git diff --name-only --diff-filter=ACMR @{push}
      glob: "*.{js,ts,jsx,tsx}"
      run: pnpm exec eslint {files}
    types:
      files: git diff --name-only --diff-filter=ACMR @{push}
      glob: "*.{js,ts, jsx, tsx}"
      run: pnpm exec tsc --noEmit
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: pnpm exec commitlint --edit
