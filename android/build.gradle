buildscript {
  // Older React Native Android templates do not provide the Kotlin Android plugin.
  if (!rootProject.plugins.hasPlugin('com.facebook.react.rootproject')) {
    def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.kotlinVersion : '1.8.22'
    repositories {
      google()
      mavenCentral()
    }
    dependencies {
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
  }
}

apply plugin: "com.android.library"

// AGP can provide Kotlin support itself; avoid registering the extension twice.
if (project.extensions.findByName('kotlin') == null) {
  apply plugin: "org.jetbrains.kotlin.android"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["UvcCamera_" + name]
}

android {
  namespace "com.uvccamera"
  compileSdk getExtOrDefault("compileSdkVersion").toInteger()

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion").toInteger()
    targetSdkVersion getExtOrDefault("targetSdkVersion").toInteger()
  }

  // Match Java and Kotlin targets in templates without React Native's JVM alignment.
  if (!rootProject.plugins.hasPlugin('com.facebook.react.rootproject')) {
    compileOptions {
      sourceCompatibility JavaVersion.VERSION_1_8
      targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
      jvmTarget = '1.8'
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation 'com.herohan:UVCAndroid:1.0.13'
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
